spring.application.name=messagerie
server.port=8080

# Base MySQL (creee automatiquement si elle n'existe pas)
spring.datasource.url=jdbc:mysql://localhost:3306/messagerie?createDatabaseIfNotExist=true&serverTimezone=Europe/Paris
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate : cree et met a jour les tables a partir des entites
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
